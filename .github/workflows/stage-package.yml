name: Reserve NPM Package Name

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-payload:
    name: Build Package Staging Payload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build payload without network access
        run: |
          systemd-run --user --scope -p PrivateNetwork=yes node --permission --allow-fs-read="*" --allow-fs-write="*" scripts/build-payload.js

      - name: Upload staging payload artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-payloads
          path: payloads/
          if-no-files-found: ignore

  stage-package:
    name: Stage Package in NPM Registry
    needs: build-payload
    runs-on: ubuntu-latest
    environment: npm-staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Download staging payload artifact
        uses: actions/download-artifact@v8
        with:
          name: package-payloads
          path: payloads/
          ignore-error-and-continue: true

      - name: Stage package to NPM
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          systemd-run --user --scope -p ProtectSystem=strict -p ProtectHome=yes node --permission --allow-fs-read="*" --allow-fs-write="*" --allow-net="registry.npmjs.org" scripts/stage-package.js
