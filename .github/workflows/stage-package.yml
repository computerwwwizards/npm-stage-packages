name: Stage NPM Packages

on:
  push:
    branches:
      - main
    paths:
      - 'catalog.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-payload:
    name: Build Staging Payload
    runs-on: ubuntu-latest
    outputs:
      should_stage: ${{ steps.build.outputs.should_stage }}
      integrity: ${{ steps.build.outputs.integrity }}
      package_name: ${{ steps.build.outputs.package_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      - name: Build Payload
        id: build
        run: |
          mkdir -p /tmp/npm-payload
          node --permission \
            --allow-fs-read="$(realpath "${GITHUB_WORKSPACE}/catalog.json")" \
            --allow-fs-read="$(realpath "${GITHUB_WORKSPACE}/package.json")" \
            --allow-fs-read="$(realpath "${GITHUB_WORKSPACE}/scripts/build-payload.js")" \
            --allow-fs-write="$(realpath /tmp/npm-payload)" \
            --allow-fs-write="$(realpath "${GITHUB_OUTPUT}")" \
            ./scripts/build-payload.js

      - name: Upload Payload Artifact
        if: steps.build.outputs.should_stage == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: staging-payload.json
          path: /tmp/npm-payload/staging-payload.json
          archive: false
          retention-days: 1

  stage-package:
    name: Stage Package to NPM Registry
    needs: build-payload
    if: needs.build-payload.outputs.should_stage == 'true'
    runs-on: ubuntu-latest
    environment: npm-staging-approval
    steps:
      - name: Checkout Stage Script Only
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            package.json
            scripts/stage-package.js
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      - name: Download Payload Artifact
        uses: actions/download-artifact@v8
        with:
          name: staging-payload.json
          path: /tmp/npm-payload

      - name: Stage Package
        env:
          NPM_STAGE_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
          EXPECTED_INTEGRITY: ${{ needs.build-payload.outputs.integrity }}
          PACKAGE_NAME: ${{ needs.build-payload.outputs.package_name }}
          PAYLOAD_PATH: /tmp/npm-payload/staging-payload.json
        run: |
          node --permission \
            --allow-net \
            --allow-fs-read="$(realpath "${GITHUB_WORKSPACE}/package.json")" \
            --allow-fs-read="$(realpath "${GITHUB_WORKSPACE}/scripts/stage-package.js")" \
            --allow-fs-read="$(realpath /tmp/npm-payload/staging-payload.json)" \
            ./scripts/stage-package.js
